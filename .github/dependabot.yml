# Dependabot-konfigurasjon.
#
# Diskkart bygges med C#-kompilatoren som følger med .NET Framework og har
# ingen pakkebehandler (ingen NuGet-pakker), så det eneste Dependabot kan
# følge med på er versjonene av actions i .github/workflows.
# Minor- og patch-oppdateringer samles i én PR. Major-oppdateringer kommer som
# egne PR-er og flettes ikke automatisk.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Oslo
    open-pull-requests-limit: 5
    groups:
      github-actions:
        update-types: ["minor", "patch"]
